name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: proje.zip yuklendiyse ac (yalnizca kaynak yoksa)
        run: |
          if [ ! -f app/build.gradle.kts ] && [ -f proje.zip ]; then
            echo "Kaynak yok, proje.zip aciliyor"
            unzip -o proje.zip
          else
            echo "Kaynak deposunun kokunde; proje.zip kullanilmadi"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
